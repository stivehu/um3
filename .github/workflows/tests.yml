name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  pytest:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        # requirements.txt is not used as-is: PyQt6 is commented out there
        # (see CLAUDE.md) and buildozer/cx-freeze/pynguin from
        # requirements-dev.txt are unrelated to running the test suite.
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 pyserial requests beautifulsoup4 huey pyperclip
          pip install pytest pytest-cov pytest-mock pytest-qt

      - name: Run tests
        run: pytest

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov/
